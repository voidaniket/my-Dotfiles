# ~/.tmux.conf  -- reload with: prefix + r

# ---------- Prefix: Ctrl-a instead of Ctrl-b ----------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---------- General ----------
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"   # true color in Konsole
set -g mouse on                  # click panes, drag borders, scroll
set -g history-limit 50000
set -g base-index 1              # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on       # no gaps when closing windows
set -sg escape-time 10           # no lag after Esc (good for vim)
set -g focus-events on
set -g set-clipboard on
set -g status-interval 5
set -g display-time 1500
setw -g mode-keys vi
set -g status-keys vi

# ---------- Reload config ----------
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# ---------- Splits & windows (keep current directory) ----------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---------- Pane navigation (vim style) ----------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows with Alt+Left/Right (no prefix)
bind -n M-Left  previous-window
bind -n M-Right next-window

# ---------- Copy mode (vi keys) ----------
# X11: xclip.  On Wayland replace with: wl-copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# ---------- Appearance ----------
set -g status-position top
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold]  #S #[bg=#1e1e2e] "

set -g status-right-length 60
set -g status-right "#[fg=#a6adc8]#{?client_prefix,#[bg=#f38ba8 fg=#1e1e2e bold] PREFIX #[default] ,}%a %d %b  #[fg=#89b4fa,bold]%H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#f9e2af,bold] #I:#W#{?window_zoomed_flag, 🔍,} "
setw -g window-status-style "fg=#6c7086"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#f9e2af"
set -g mode-style "bg=#45475a,fg=#cdd6f4"

# ---------- Optional plugins (TPM) ----------
# Install TPM first:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then uncomment, reload, and press prefix + I to install.
#
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions (prefix+Ctrl-s / Ctrl-r)
# set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save
# set -g @continuum-restore 'on'
# run '~/.tmux/plugins/tpm/tpm'
